name: Deploy to production

on:
  # Manually triggerable (Actions tab → "Deploy to production")
  workflow_dispatch:
    inputs: &workflow_inputs
      deploy-authentik:
        description: Also deploy the authentik stack
        type: boolean
        default: true
        required: false
  # Reusable workflow, called from build-push-cd-prod.yml
  workflow_call:
    inputs: *workflow_inputs
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      WORK_DIR:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
      - name: connect and pull
        run: >-
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          "cd ${{ secrets.WORK_DIR }}
          && git pull
          && docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          && docker compose pull
          && docker compose up -d
          && exit"
      - name: cleanup
        run: rm -rf ~/.ssh

  deploy-production-authentik:
    name: Deploy authentik to production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: inputs.deploy-authentik

    steps:
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
      - name: connect and pull
        # docker login required to download authentik from ghcr.io
        run: >-
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          "cd ${{ secrets.WORK_DIR }}
          && git pull
          && docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          && cd authentik
          && [[ -e .env ]]
          && ./generate-compose.sh
          && docker compose pull
          && docker compose up -d
          && exit"
      - name: cleanup
        run: rm -rf ~/.ssh
